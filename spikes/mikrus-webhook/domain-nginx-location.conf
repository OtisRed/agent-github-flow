# Include in the existing domain's server block; the receiver is experimental.
location = /agent-github-flow/webhook {
    access_log off;
    limit_req zone=agf_73_rate burst=10 nodelay;
    limit_conn agf_73_connections 8;
    client_max_body_size 256k;
    client_body_timeout 8s;
    proxy_request_buffering on;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
    limit_except POST { deny all; }
    if ($http_x_github_event !~ "^(repository_dispatch|ping)$") { return 503; }
    proxy_pass http://127.0.0.1:19072/agf-spike/webhook;
}
