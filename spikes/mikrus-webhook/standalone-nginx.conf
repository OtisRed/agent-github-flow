worker_processes 1;
error_log stderr warn;
pid /run/agf-webhook-proxy-71/nginx.pid;
events { worker_connections 64; }
http {
    limit_req_zone $server_name zone=agf_spike_rate:1m rate=2r/s;
    limit_conn_zone $server_name zone=agf_spike_connections:1m;
    client_body_temp_path /var/lib/agf-webhook-proxy-71/client_temp;
    proxy_temp_path /var/lib/agf-webhook-proxy-71/proxy_temp;
    fastcgi_temp_path /var/lib/agf-webhook-proxy-71/fastcgi_temp;
    uwsgi_temp_path /var/lib/agf-webhook-proxy-71/uwsgi_temp;
    scgi_temp_path /var/lib/agf-webhook-proxy-71/scgi_temp;
    server {
        listen 127.0.0.1:19072;
        server_name agf-spike;
        access_log off;
        client_max_body_size 256k;
        client_body_timeout 8s;
        client_header_timeout 8s;
        limit_req zone=agf_spike_rate burst=10 nodelay;
        limit_conn agf_spike_connections 8;
        location = /agf-spike/webhook {
            proxy_request_buffering on;
            proxy_connect_timeout 2s;
            proxy_read_timeout 9s;
            proxy_pass http://127.0.0.1:19071;
        }
        location = /agf-spike/health {
            proxy_connect_timeout 2s;
            proxy_read_timeout 9s;
            proxy_pass http://127.0.0.1:19071;
        }
        location / { return 404; }
    }
}
