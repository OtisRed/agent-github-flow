name: Flow event preflight
on:
  issue_comment:
    types: [created, edited, deleted]
  issues:
    types: [opened, closed, reopened]
  repository_dispatch:
    types: [flow-wakeup-v1]
permissions:
  contents: read
jobs:
  preflight:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    name: Read-only event preflight
    runs-on: ubuntu-24.04
    environment: flow-controller
    timeout-minutes: 3
    steps:
      - name: Check out the trusted default-branch revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Recognize event without changing GitHub state
        env:
          FLOW_EVENT_ROUTES: ${{ secrets.FLOW_EVENT_ROUTES }}
        run: node src/flow-event-cli.mjs
