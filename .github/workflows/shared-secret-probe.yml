name: Shared workflow environment probe
on:
  workflow_call:
    secrets:
      PROJECT_ACCESS_TOKEN:
        required: false
permissions:
  contents: read
jobs:
  project-read:
    runs-on: ubuntu-latest
    environment: pat-probe
    timeout-minutes: 3
    steps:
      - name: Check user credential and read Project
        env:
          GH_TOKEN: ${{ secrets.PROJECT_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then echo 'Environment credential unavailable'; exit 1; fi
          echo 'Environment credential present'
          result=$(gh api graphql -f query='query { user(login: "OtisRed") { projectV2(number: 10) { number } } }' --jq '.data.user.projectV2.number')
          if [ "$result" != '10' ]; then echo 'Project read failed'; exit 1; fi
          echo 'Project read OK'
