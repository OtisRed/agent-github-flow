name: VSone Project readiness probe
on:
  push:
    branches: [spike/workflow-call-allowed]
    paths: [.github/workflows/vsone-readiness-probe.yml]
permissions: {}
jobs:
  read-project-fields:
    if: github.ref == 'refs/heads/spike/workflow-call-allowed'
    runs-on: ubuntu-24.04
    environment: pat-probe
    timeout-minutes: 5
    steps:
      - name: Read Project schema without mutation
        env:
          GH_TOKEN: ${{ secrets.PROJECT_ACCESS_TOKEN }}
          PROJECT_BINDING: ${{ secrets.AGF_PROBE_PROJECT }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" || ! "${PROJECT_BINDING:-}" =~ ^[a-zA-Z0-9_-]+/project/[0-9]+$ ]]; then
            echo 'Readiness: missing credentials or configuration'; exit 1
          fi
          project_number="${PROJECT_BINDING##*/}"
          project_owner="${PROJECT_BINDING%%/*}"
          gh api graphql \
            -f query='query($owner:String!,$number:Int!) { user(login:$owner) { projectV2(number:$number) { fields(first:100) { nodes { __typename ... on ProjectV2Field { name dataType } ... on ProjectV2SingleSelectField { name dataType options { name } } ... on ProjectV2IterationField { name dataType } } pageInfo { hasNextPage } } } } }' \
            -f owner="$project_owner" -F number="$project_number" \
            > "$RUNNER_TEMP/project-fields.json" 2>/dev/null || { echo 'Readiness: Project GraphQL read failed'; exit 1; }
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const document = JSON.parse(await readFile(process.env.RUNNER_TEMP + '/project-fields.json', 'utf8'));
          const fields = document?.data?.user?.projectV2?.fields;
          if (!fields || fields.pageInfo?.hasNextPage !== false || !Array.isArray(fields.nodes)) throw Error('Readiness: incomplete field list');
          const status = fields.nodes.filter(field => field.name === 'Status');
          const expected = ['decision-gate', 'needs-design', 'audit', 'spike', 'agent-ready', 'review', 'smoke', 'done'];
          if (status.length !== 1 || status[0].__typename !== 'ProjectV2SingleSelectField'
            || !Array.isArray(status[0].options)
            || new Set(status[0].options.map(option => option.name)).size !== expected.length
            || expected.some(name => !status[0].options.some(option => option.name === name))) {
            throw Error('Readiness: Status configuration mismatched');
          }
          console.log('Readiness: Status options match the common model');
          const checkpoint = fields.nodes.filter(field => field.name === 'FLOW checkpoint');
          if (checkpoint.length === 0) console.log('Readiness blocked: checkpoint field missing');
          else if (checkpoint.length > 1) console.log('Readiness blocked: ambiguous checkpoint field');
          else if (checkpoint[0].__typename !== 'ProjectV2Field' || checkpoint[0].dataType !== 'TEXT') console.log('Readiness blocked: checkpoint field has wrong type');
          else console.log('Readiness: checkpoint text field present; trust and ownership remain unverified');
          NODE
