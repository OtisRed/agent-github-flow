name: App webhook redelivery spike probe
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        required: true
        type: string
permissions: {}
jobs:
  redeliver:
    if: github.ref == 'refs/heads/probe/71-app-webhook-redelivery' && github.sha == inputs.expected_sha && github.actor == 'OtisRed' && github.triggering_actor == 'OtisRed' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    environment: flow-controller
    timeout-minutes: 5
    steps:
      - name: Locate and redeliver exactly one recorded event
        env:
          APP_ID: ${{ vars.FLOW_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          TARGET_REPO_ID: ${{ secrets.AGF_SPIKE_71_ID }}
          DELIVERY_GUID: ${{ secrets.AGF_SPIKE_71_DELIVERY }}
        run: |
          node <<'NODE'
          const {createSign} = require('node:crypto');
          (async () => {
            const {APP_ID, APP_PRIVATE_KEY, TARGET_REPO_ID, DELIVERY_GUID} = process.env;
            if (!/^\d+$/.test(APP_ID || '') || !APP_PRIVATE_KEY || !/^\d+$/.test(TARGET_REPO_ID || '') || !/^[0-9a-f-]{36}$/.test(DELIVERY_GUID || '')) throw Error('Invalid configuration');
            const b64 = x => Buffer.from(JSON.stringify(x)).toString('base64url');
            const now = Math.floor(Date.now()/1000), signed = `${b64({alg:'RS256',typ:'JWT'})}.${b64({iat:now-30,exp:now+300,iss:APP_ID})}`;
            const signature = createSign('RSA-SHA256').update(signed).end().sign(APP_PRIVATE_KEY,'base64url');
            const headers = {'authorization':`Bearer ${signed}.${signature}`, 'accept':'application/vnd.github+json', 'x-github-api-version':'2022-11-28'};
            const base='https://api.github.com/app/hook/deliveries';
            const response=await fetch(base+'?per_page=100',{headers,redirect:'error',signal:AbortSignal.timeout(10000)});
            if (!response.ok) throw Error('Delivery listing failed');
            const deliveries=await response.json();
            if (!Array.isArray(deliveries) || deliveries.length>=100) throw Error('Delivery listing incomplete');
            const matches=deliveries.filter(x=>x.guid===DELIVERY_GUID && String(x.repository_id)===TARGET_REPO_ID && x.event==='repository_dispatch' && x.action==='agf_webhook_spike_v1' && x.redelivery===false && x.status_code>=200 && x.status_code<300 && Number.isSafeInteger(x.id));
            if (matches.length!==1) throw Error('Delivery mismatch');
            const redelivery=await fetch(`${base}/${matches[0].id}/attempts`,{method:'POST',headers,redirect:'error',signal:AbortSignal.timeout(10000)});
            if (redelivery.status!==202) throw Error('Redelivery uncertain');
            console.log('Redelivery accepted; receiver result must be checked independently.');
          })().catch(()=>{console.error('Probe failed or result is uncertain; do not retry automatically.');process.exitCode=1;});
          NODE
