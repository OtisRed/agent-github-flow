name: App webhook delivery metadata diagnostic
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        required: true
        type: string
permissions: {}
jobs:
  inspect:
    if: github.ref == 'refs/heads/probe/71-webhook-diagnostic' && github.sha == inputs.expected_sha && github.actor == 'OtisRed' && github.triggering_actor == 'OtisRed' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    environment: flow-controller
    timeout-minutes: 5
    steps:
      - name: Inspect delivery metadata only
        env:
          APP_ID: ${{ vars.FLOW_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          TARGET_REPO_ID: ${{ secrets.AGF_SPIKE_71_ID }}
          DELIVERY_GUID: ${{ secrets.AGF_SPIKE_71_DELIVERY }}
        run: |
          node <<'NODE'
          const {createSign} = require('node:crypto');
          (async () => {
            const {APP_ID, APP_PRIVATE_KEY, TARGET_REPO_ID, DELIVERY_GUID} = process.env;
            console.log('Configuration shape:', /^\d+$/.test(APP_ID || ''), Boolean(APP_PRIVATE_KEY), /^\d+$/.test(TARGET_REPO_ID || ''), /^[0-9a-f-]{36}$/.test(DELIVERY_GUID || ''));
            if (!/^\d+$/.test(APP_ID || '') || !APP_PRIVATE_KEY || !/^\d+$/.test(TARGET_REPO_ID || '') || !/^[0-9a-f-]{36}$/.test(DELIVERY_GUID || '')) process.exit(1);
            const b64 = x => Buffer.from(JSON.stringify(x)).toString('base64url');
            const now = Math.floor(Date.now()/1000), signed = `${b64({alg:'RS256',typ:'JWT'})}.${b64({iat:now-30,exp:now+300,iss:APP_ID})}`;
            const signature = createSign('RSA-SHA256').update(signed).end().sign(APP_PRIVATE_KEY,'base64url');
            const headers = {'authorization':`Bearer ${signed}.${signature}`, 'accept':'application/vnd.github+json', 'x-github-api-version':'2022-11-28'};
            const response=await fetch('https://api.github.com/app/hook/deliveries?per_page=100',{headers,redirect:'error',signal:AbortSignal.timeout(10000)});
            console.log('Listing status:',response.status);
            if (!response.ok) process.exit(1);
            const deliveries=await response.json();
            if (!Array.isArray(deliveries)) process.exit(1);
            const matches=deliveries.filter(x=>x.guid===DELIVERY_GUID);
            console.log('Items and matching GUIDs:',deliveries.length,matches.length);
            for (const x of matches) console.log('Metadata:',JSON.stringify({repoMatches:String(x.repository_id)===TARGET_REPO_ID,event:x.event,action:x.action,redelivery:x.redelivery,status_code:x.status_code,idValid:Number.isSafeInteger(x.id)}));
          })().catch(()=>{console.error('Read-only diagnostic failed.');process.exitCode=1;});
          NODE
