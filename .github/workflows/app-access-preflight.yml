name: GitHub App access preflight
on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      repository-owner:
        required: true
        type: string
      repository-name:
        required: true
        type: string
      app-id:
        required: true
        type: string
      app-slug:
        required: true
        type: string
    secrets:
      APP_PRIVATE_KEY:
        required: true
permissions: {}
jobs:
  app-read:
    name: Verify scoped GitHub App read
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 3
    steps:
      - name: Validate App configuration
        env:
          APP_ID: ${{ inputs.app-id }}
          APP_SLUG: ${{ inputs.app-slug }}
          REPO_OWNER: ${{ inputs.repository-owner }}
          REPO_NAME: ${{ inputs.repository-name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$APP_ID" =~ ^[1-9][0-9]{0,19}$ ]] || [[ ! "$APP_SLUG" =~ ^[a-z0-9-]{1,100}$ ]] || [[ ! "$REPO_OWNER" =~ ^[A-Za-z0-9-]{1,39}$ ]] || [[ ! "$REPO_NAME" =~ ^[A-Za-z0-9_.-]{1,100}$ ]] || [[ "$REPO_NAME" == '.' || "$REPO_NAME" == '..' ]]; then
            echo 'App preflight: invalid configuration'; exit 1
          fi
          echo 'App preflight: configuration accepted'
      - name: Create scoped App token
        id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ inputs.app-id }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ inputs.repository-owner }}
          repositories: ${{ inputs.repository-name }}
          permission-contents: read
      - name: Verify App identity and repository
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          ACTUAL_SLUG: ${{ steps.app.outputs.app-slug }}
          EXPECTED_SLUG: ${{ inputs.app-slug }}
          REPO_OWNER: ${{ inputs.repository-owner }}
          REPO_NAME: ${{ inputs.repository-name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" || "$ACTUAL_SLUG" != "$EXPECTED_SLUG" ]]; then echo 'App preflight: identity mismatch'; exit 1; fi
          target="$REPO_OWNER/$REPO_NAME"
          selected=$(gh api /installation/repositories --jq 'if .total_count == 1 and (.repositories | length) == 1 then .repositories[0].full_name else "" end' 2>/dev/null) || { echo 'App preflight: installation read failed'; exit 1; }
          if [[ "$selected" != "$target" ]]; then echo 'App preflight: repository scope mismatch'; exit 1; fi
          name=$(gh api "/repos/$target" --jq '.full_name' 2>/dev/null) || { echo 'App preflight: repository read failed'; exit 1; }
          if [[ "$name" != "$target" ]]; then echo 'App preflight: incomplete response'; exit 1; fi
          echo 'App preflight: scoped repository read OK'
