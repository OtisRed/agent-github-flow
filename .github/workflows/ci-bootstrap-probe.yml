name: Temporary shared admission probe
on:
  push:
    branches: [codex/182-ci-onboarding]
permissions:
  contents: read
  checks: read
jobs:
  invalid-input:
    runs-on: ubuntu-24.04
    steps:
      - name: Verify shared action rejects invalid configuration
        id: probe
        continue-on-error: true
        uses: OtisRed/agent-github-flow/.github/actions/wait-admission@c3c3323163769302b576f7a1e7fef5830926fc29
        with:
          app-id: '0'
      - name: Require rejection
        env:
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
        run: test "$PROBE_OUTCOME" = failure
